name: swap-release-asset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/swap-asset.yml']

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and verify the .hmod
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          members = ['Cargo.toml','LICENSE','README.md','hnmod/Cargo.toml','hnmod/LICENSE','hnmod/README.md','hnmod/compatibility.json','hnmod/mixins/auto_lectern/Cargo.toml','hnmod/mixins/auto_lectern/LICENSE','hnmod/mixins/auto_lectern/README.md','hnmod/mixins/auto_lectern/command.rs','hnmod/mixins/auto_lectern/frame.rs','hnmod/mixins/auto_lectern/horizon-mixin.toml','hnmod/mixins/auto_lectern/movement.rs','hnmod/mixins/auto_lectern/runtime.rs','hnmod/tools/package.py','src/auto_lectern.rs','src/commands_seam.rs','src/dummy_input.rs','src/goal.rs','src/interfaces.rs','src/lib.rs','src/mixins.rs','src/seams.rs','src/state.rs','src/tests.rs']
          with zipfile.ZipFile('auto_lectern-1.0.0.hmod','w') as z:
              for m in members:
                  zi = zipfile.ZipInfo(m, date_time=(2026,11,21,0,0,0))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.external_attr = 0o644 << 16
                  z.writestr(zi, open(m,'rb').read())
          PY
          GOT=$(sha256sum auto_lectern-1.0.0.hmod | cut -d' ' -f1)
          echo "package sha256: $GOT"
          if [ "$GOT" != "8d1bca6506d1774ba4bc023b4d9e7afcd209916a1e888483d11b8b5e1236595d" ]; then
            echo "package sha mismatch"
            exit 1
          fi

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload v1.0.0 auto_lectern-1.0.0.hmod --clobber
          gh release delete-asset v1.0.0 auto_lectern-1.0.0.hnmod --yes

      - name: Remove this workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-asset.yml
          git commit -m "Remove temporary release-asset workflow"
          git push origin HEAD:main
